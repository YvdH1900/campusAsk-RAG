# 测试配置
[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=html:tests/tmp_test/htmlcov",
    "--cov-report=term-missing",
]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "rag: marks tests as RAG functionality tests",
    "evaluation: Golden Dataset retrieval quality evaluation",
    "retrieval: retrieval-only quality evaluation",
    "generation: generation layer quality evaluation (requires backend running)",
    "mock: use mock mode, no external services",
    "real: use real retrieval, requires Milvus + Embedding API",
]
# 覆盖率配置
[tool.coverage.run]
source = ["app"]
data_file = "tests/tmp_test/.coverage"
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# 显示覆盖率阈值
fail_under = 70
