# ================================================
# CampusAsk-RAG 生产环境 Nginx 配置
# ================================================
# 作用：
# 1. 作为反向代理，统一通过 80/443 端口提供服务
# 2. 隐藏后端所有端口（8000 等）
# 3. 默认 HTTP 即可工作，HTTPS 为可选项
# ================================================
# 使用说明：
#   - 首次部署直接使用此文件，通过 HTTP 访问
#   - 配置 HTTPS 时：申请证书后取消下方 HTTPS server 的注释，
#     并将 HTTP server 的 return 301 行取消注释
# ================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # ================================================
    # HTTP 服务器（默认配置，开箱即用）
    # ================================================
    server {
        listen 80;
        listen [::]:80;
        server_name yourdomain.com;  # 修改为你的域名或服务器 IP

        # --- HTTPS 启用后，取消下面这行的注释，注释掉后面的 root/location ---
        # return 301 https://$server_name$request_uri;

        # ================================================
        # 前端静态文件服务
        # ================================================
        location / {
            root /var/www/campusask-rag;
            index index.html;
            try_files $uri $uri/ /index.html;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ================================================
        # 后端 API 反向代理
        # ================================================
        location /api/ {
            proxy_pass http://backend:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # 禁止访问敏感路径
        location ~ ^/(docs|redoc|openapi\.json) { return 403; }
        location ~ ^/(mysql|redis|milvus|minio|rabbitmq) { return 403; }
    }

    # ================================================
    # HTTPS 服务器（可选，有证书后取消注释启用）
    # ================================================
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_session_tickets off;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     location / {
    #         root /var/www/campusask-rag;
    #         index index.html;
    #         try_files $uri $uri/ /index.html;
    #         add_header X-Frame-Options "SAMEORIGIN" always;
    #         add_header X-Content-Type-Options "nosniff" always;
    #     }
    #
    #     location /api/ {
    #         proxy_pass http://backend:8000;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #         proxy_connect_timeout 60s;
    #         proxy_send_timeout 60s;
    #         proxy_read_timeout 60s;
    #         proxy_buffering off;
    #     }
    #
    #     location ~ ^/(docs|redoc|openapi\.json) { return 403; }
    #     location ~ ^/(mysql|redis|milvus|minio|rabbitmq) { return 403; }
    # }

    client_max_body_size 100M;
}